name: Déploiement GitHub Pages

on:
  # Comme deploy.yml : se déclenche après un CI réussi sur main, jamais sur
  # un commit dont lint/typecheck/tests/build ont échoué.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # attendre la release du commit (VER-09)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # tags complets : version affichée (VER-09)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Le tag de release est créé par release.yml, en parallèle de la CI : on attend
      # sa fin et on récupère les tags avant de construire (VER-09).
      - name: Attendre la release du commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh .github/scripts/wait-release.sh "${{ github.event.workflow_run.head_sha || github.sha }}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build (client pointant vers le Worker Cloudflare)
        env:
          # Le client GitHub Pages est servi sur une origine différente du
          # Worker : cette variable (Settings → Secrets and variables →
          # Actions → Variables, vars.DEPLOY_URL — la même que celle lue par
          # deploy.yml pour sa vérification post-déploiement) lui indique où
          # trouver l'API et le WebSocket. Valeur de repli : l'URL
          # *.workers.dev par défaut du Worker actuellement déployé.
          VITE_SYNC_WORKER_URL: ${{ vars.DEPLOY_URL || 'https://dansmahotte.douzem.workers.dev' }}
          # Domaine personnalisé (public/CNAME) : l'app est servie à la
          # racine du domaine, pas sous /<nom-du-dépôt>/.
          VITE_BASE_PATH: /
        run: npm run build
      - name: Fallback SPA (routes /l/CODE rechargées ou ouvertes directement)
        # GitHub Pages n'a pas d'équivalent au `not_found_handling:
        # single-page-application` de Cloudflare : sans ceci, ouvrir ou
        # recharger un lien partagé donnerait un 404 au lieu de servir l'app,
        # qui route elle-même via location.pathname une fois chargée.
        run: cp dist/client/index.html dist/client/404.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/client
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
