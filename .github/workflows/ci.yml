name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Vérification des types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit-tests:
    name: Tests unitaires + couverture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e-tests:
    name: Tests fonctionnels (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  mutation-testing-plan:
    name: Mutation testing — plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # Un job par module, d'après les cibles de stryker.config.mjs.
      - id: plan
        run: node .github/scripts/mutation-matrix.mjs

  mutation-testing-module:
    name: Mutation testing — ${{ matrix.name }}
    needs: mutation-testing-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-testing-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mutation-testing/package-lock.json
      - run: npm ci
      # Dépendances de Stryker isolées dans leur propre node_modules :
      # @stryker-mutator/instrumenter dépend de Babel 8, incompatible avec
      # Babel 7 qu'utilise vite-plugin-pwa (workbox-build) à la racine —
      # voir mutation-testing/package.json.
      - run: npm ci --prefix mutation-testing
      # Seuil bloquant à 100 % : un seul mutant survivant fait échouer le job.
      - run: npm run test:mutation
        env:
          MUTATE: ${{ matrix.mutate }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-report-${{ matrix.name }}
          path: mutation-report/
          retention-days: 14

  # Un seul check stable « Mutation testing (logique pure) » pour la protection
  # de branche, quel que soit le nombre de modules.
  mutation-testing:
    name: Mutation testing (logique pure)
    needs: mutation-testing-module
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tous les modules à 100 %
        env:
          RESULT: ${{ needs.mutation-testing-module.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::Mutation testing : au moins un module sous 100 % ($RESULT)."
            exit 1
          fi

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit complet (production + développement)
        run: npm audit --audit-level=high

  build:
    name: Build de production
    needs: [lint, typecheck, unit-tests, e2e-tests, mutation-testing, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pas un vrai déploiement de preview (ça demanderait un hébergeur
      # tiers en plus de Cloudflare + un nouveau secret) : juste de quoi
      # télécharger et lancer le build en local pour relire une PR sans
      # attendre le merge.
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-build-preview
          path: dist/client
          retention-days: 7
